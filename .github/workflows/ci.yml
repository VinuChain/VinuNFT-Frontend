name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn audit:triage
      - name: Verify deployed contract truth (addresses, first blocks, ABI/deployment agreement)
        run: yarn verify:deployed
      - run: yarn build
      # Must run after the build: the policy is injected into public/ by
      # add_csp.js, so before it there is nothing to check and the CSP tests
      # skip themselves.
      - name: Verify the injected Content-Security-Policy
        run: yarn verify:csp
      # Rendered checks drive the real production build in Chromium, so they
      # also need the build to exist and skip themselves without it.
      - name: Install Chromium for rendered checks
        run: npx playwright install --with-deps chromium
      - name: Verify rendered pages, mobile layout and accessibility basics
        run: yarn verify:rendered
